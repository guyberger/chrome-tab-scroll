<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Both of these come before anything else so the window never paints a
         white frame before the document loads. -->
    <meta name="color-scheme" content="dark" />
    <style>
      :root,
      html,
      body {
        background: #202024;
        margin: 0;
        height: 100%;
      }
      body {
        color: #f5f5f7;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
    </style>
    <title>Switch tab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
