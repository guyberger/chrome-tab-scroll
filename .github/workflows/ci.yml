name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Vitest requires >= 22.12; see "engines" in its package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the built extension looks loadable
        run: |
          test -f dist/manifest.json
          node -e "
            const m = require('./dist/manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            if (!m.background?.service_worker) throw new Error('no service worker');
            if (!m.content_scripts?.length) throw new Error('no content script');

            // Forward opens and steps; backward is its Shift variant.
            for (const name of ['open-switcher', 'cycle-backward']) {
              if (!m.commands?.[name]?.suggested_key) {
                throw new Error('missing command ' + name + ', got ' + Object.keys(m.commands ?? {}).join(', '));
              }
            }

            // The toolbar popup is the only route to assigning a shortcut.
            const popup = m.action?.default_popup;
            if (!popup) throw new Error('action has no default_popup');
            if (!require('node:fs').existsSync('dist/' + popup)) {
              throw new Error('default_popup missing from the build: ' + popup);
            }

            console.log('manifest ok:', m.name, m.version);
          "

      - uses: actions/upload-artifact@v5
        with:
          name: extension
          path: dist/
