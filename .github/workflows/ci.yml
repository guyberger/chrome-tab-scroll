name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the built extension looks loadable
        run: |
          test -f dist/manifest.json
          node -e "
            const m = require('./dist/manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            if (!m.background?.service_worker) throw new Error('no service worker');
            if (!m.content_scripts?.length) throw new Error('no content script');
            if (!m.commands?.['cycle-forward']) throw new Error('no forward command');
            console.log('manifest ok:', m.name, m.version);
          "

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/
