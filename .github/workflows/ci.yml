name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Vitest requires >= 22.12; see "engines" in its package.json.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the built extension looks loadable
        run: |
          test -f dist/manifest.json
          node -e "
            const m = require('./dist/manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            if (!m.background?.service_worker) throw new Error('no service worker');
            if (!m.content_scripts?.length) throw new Error('no content script');
            const commands = Object.keys(m.commands ?? {});
            // Exactly one binding: the hotkey opens the strip, Tab moves it.
            if (commands.length !== 1 || commands[0] !== 'open-switcher') {
              throw new Error('expected a single open-switcher command, got ' + commands.join(', '));
            }
            console.log('manifest ok:', m.name, m.version);
          "

      - uses: actions/upload-artifact@v5
        with:
          name: extension
          path: dist/
